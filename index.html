<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1B28">
<meta name="description" content="Banc vidéo d'entraîneur de hockey : analyse vidéo, tableau de patinoire et pratiques animées.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Banc vidéo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Banc Vidéo Hockey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : poste de vidéo d'entraîneur — barre d'outils verticale, écran vidéo au centre, panneau de travail à droite (empilé sur téléphone) */
:root{
  --ice:#EDF2F6; --surface:#FFFFFF; --surface-2:#E2E9EF; --line:#C9D4DD;
  --ink:#0F1B28; --ink-2:#4B5B6C; --goal:#D7263D; --blue:#1D5FC2; --on-accent:#FFFFFF;
  --stage:#0A1017; --stage-ink:#E9F0F6; --ok:#1E8E5A; --warn:#B7791F;
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ice:#0D141B; --surface:#151F29; --surface-2:#1D2935; --line:#2B3946;
  --ink:#E5EDF4; --ink-2:#9BAABA; --goal:#FF4D5E; --blue:#64A2FF; --on-accent:#FFFFFF;
  --stage:#04080C; --stage-ink:#E9F0F6; --ok:#3CCB86; --warn:#E3A93C; color-scheme:dark}}
:root[data-theme="dark"]{
  --ice:#0D141B; --surface:#151F29; --surface-2:#1D2935; --line:#2B3946;
  --ink:#E5EDF4; --ink-2:#9BAABA; --goal:#FF4D5E; --blue:#64A2FF; --on-accent:#FFFFFF;
  --stage:#04080C; --stage-ink:#E9F0F6; --ok:#3CCB86; --warn:#E3A93C; color-scheme:dark}
html,body{height:100%}
body{background:var(--ice);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

#app{height:100%;display:grid;grid-template-columns:60px minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"top top top" "tools center panel";gap:10px;padding:10px 16px 12px}

/* header */
.top{grid-area:top;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.brand span{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-top:3px}
.projname{flex:1 1 180px;min-width:0;max-width:360px;background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px;font-weight:600;font-size:15px}
.projname:hover,.projname:focus{border-color:var(--line);background:var(--surface)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;font-weight:600;font-size:13px;white-space:nowrap;line-height:1.1}
.btn:hover{border-color:var(--ink-2)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--goal);border-color:var(--goal);color:var(--on-accent)}
.btn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.danger{color:var(--goal)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.filebtn{position:relative;overflow:hidden;cursor:pointer}
.fileov{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px;z-index:2}
.filebtn:focus-within{outline:2px solid var(--blue);outline-offset:2px}
.btn.rec-on{background:var(--goal);color:var(--on-accent);border-color:var(--goal)}

/* toolbar */
.tools{grid-area:tools;display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px;overflow-y:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tsep{height:1px;background:var(--line);margin:4px 2px;flex:none}
.tool{flex:none;width:46px;height:40px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:var(--ink-2);position:relative}
.tool svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{background:var(--surface-2);color:var(--ink)}
.tool.active{background:var(--ink);color:var(--surface)}
.tool .k{position:absolute;right:3px;bottom:2px;font-family:var(--f-mono);font-size:9px;opacity:.55;text-transform:uppercase}

/* center */
.center{grid-area:center;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.cmpbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;font-size:13px}
.cmpbar select{max-width:260px;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--surface)}
.stages{flex:1;min-height:0;display:flex;gap:8px}
.stage{position:relative;flex:1;min-width:0;min-height:0;background:var(--stage);border-radius:var(--r);overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.stage .tag{position:absolute;top:8px;left:8px;font-family:var(--f-display);font-weight:700;color:var(--stage-ink);background:rgba(0,0,0,.5);padding:2px 8px;border-radius:5px;letter-spacing:.06em}
.badge{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:rgba(10,16,23,.82);border-radius:999px;padding:5px 14px;display:flex;align-items:center;gap:8px;pointer-events:none;white-space:nowrap}
.badge .bar{width:70px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden}
.badge .bar i{display:block;height:100%;background:#FFD23F}
.badge.rec{background:#C8102E;top:auto;bottom:10px}
.txtin{position:absolute;z-index:5;width:180px;padding:6px 8px;border-radius:6px;border:2px solid #FFD23F;background:#0A1017;color:#fff;font-family:var(--f-display);font-size:18px;font-weight:600}
.chip-float{position:absolute;bottom:12px;right:12px;z-index:4;border:0;border-radius:999px;padding:8px 14px;background:#FFD23F;color:#111;font-weight:700}

.stylebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;min-height:46px}
.toolname{display:flex;flex-direction:column;min-width:0;flex:1 1 220px}
.toolname b{font-family:var(--f-display);font-size:16px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
.toolname span{font-size:12px;color:var(--ink-2);line-height:1.3}
.swatches,.widths{display:flex;gap:5px;align-items:center}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw.active{outline:2px solid var(--ink);outline-offset:2px}
.wd{width:30px;height:26px;border:1px solid var(--line);border-radius:6px;background:var(--surface);display:grid;place-items:center}
.wd i{display:block;width:16px;border-radius:4px;background:var(--ink)}
.wd.active{border-color:var(--ink);background:var(--surface-2)}
.opt{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500}

/* transport */
.transport{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px 9px;display:flex;flex-direction:column;gap:8px}
.tl{position:relative;height:30px;cursor:pointer;touch-action:none;user-select:none}
.tl .rail{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:var(--surface-2)}
.tl .fill{position:absolute;left:0;top:12px;height:6px;border-radius:3px;background:var(--ink-2);opacity:.5}
.tl .loop{position:absolute;top:8px;height:14px;background:rgba(29,95,194,.22);border-left:2px solid var(--blue);border-right:2px solid var(--blue);display:none}
.tl .loop.on{display:block}
.tl .mk{position:absolute;top:4px;width:10px;height:10px;margin-left:-5px;transform:rotate(45deg);border:1.5px solid var(--surface);border-radius:2px}
.tl .head{position:absolute;top:2px;bottom:2px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--goal)}
.tbtns{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tc{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums;min-width:132px}
.tc small{color:var(--ink-2);font-size:12px}
.ib{width:36px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.big{width:44px;background:var(--ink);color:var(--surface);border-color:var(--ink)}
.ib.big svg{fill:currentColor;stroke:none}
.ib.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 8px;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.seg button+button{border-left:1px solid var(--line)}
.seg button.active{background:var(--ink);color:var(--surface)}
.grow{flex:1}
.lbl{font-family:var(--f-display);font-weight:700;font-size:13px}
#btnExitPresent{display:none}

/* panel */
.panel{grid-area:panel;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-height:0;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;border:0;background:transparent;padding:11px 4px 9px;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);border-bottom:3px solid transparent}
.tabs button.active{color:var(--ink);border-bottom-color:var(--goal)}
.views{flex:1;min-height:0;overflow-y:auto}
.view{padding:12px;display:flex;flex-direction:column;gap:12px}
.h{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:0}
.muted{color:var(--ink-2);font-size:12.5px;line-height:1.45;margin:0}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);font-weight:500}
.field input,.field select,.inp{border:1px solid var(--line);border-radius:7px;padding:7px 8px;background:var(--surface);color:var(--ink);font-size:14px;min-width:0;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.list{display:flex;flex-direction:column;gap:4px}
.item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 9px;min-width:0}
.item:hover{border-color:var(--ink-2)}
.item.active{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--goal)}
.item.now .t{color:var(--goal);font-weight:600}
[hidden]{display:none!important}
.item .t{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2);flex:none}
.item .n{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.2)}
.pill{font-size:11px;font-weight:600;border-radius:999px;padding:2px 7px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;flex:none}
.pill.freeze{background:#FFD23F;color:#111}
.edit{border:1px solid var(--line);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:9px;background:var(--ice)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.chip.active{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.clip{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);text-align:left;width:100%}
.clip:hover{border-color:var(--ink-2)}
.clip .n{font-weight:600}
.clip .meta{font-size:12px;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap}
.rinkwrap{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#C9D3DA}
#rinkCv{display:block;width:100%;touch-action:none}
.kbd{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px}
.kbd kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:var(--surface);justify-self:start}
.vidrow{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.vidrow.cur{box-shadow:inset 3px 0 0 var(--goal)}
.status{font-size:12px;font-weight:600}
.status.ok{color:var(--ok)} .status.no{color:var(--warn)}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
#media{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none;overflow:hidden}
#media video{width:2px;height:2px}

/* presentation */
#app.present{position:fixed;inset:0;z-index:20;background:var(--stage);grid-template-columns:minmax(0,1fr);grid-template-areas:"center";grid-template-rows:minmax(0,1fr);padding:max(8px,env(safe-area-inset-top,0px)) 16px max(8px,env(safe-area-inset-bottom,0px))}
#app.present .top,#app.present .tools,#app.present .panel,#app.present .stylebar,#app.present .cmpbar{display:none}
#app.present .transport{background:#111A23;border-color:#25313D;color:#E9F0F6}
#app.present .transport .ib,#app.present .seg button{background:#111A23;border-color:#2B3946;color:#E9F0F6}
#app.present .seg button.active,#app.present .ib.big{background:#E9F0F6;color:#111A23}
#app.present #btnExitPresent{display:grid}

/* téléphone et tablette étroite */
@media (max-width: 860px){
  body{overflow:auto}
  #app{display:flex;flex-direction:column;height:auto;min-height:100%;gap:8px;padding:8px 16px 16px}
  .top{order:0;gap:8px}
  .brand span{display:none}
  .projname{order:3;flex-basis:100%;max-width:none}
  .actions{margin-left:0;overflow-x:auto;flex-wrap:nowrap;max-width:100%;scrollbar-width:none}
  .actions .btn .tx{display:none}
  .actions .btn.primary .tx{display:inline}
  .center{display:contents}
  .cmpbar{order:1}
  .stages{order:2;flex:none;flex-direction:column}
  .stage{flex:none;width:100%;aspect-ratio:16/9;max-width:100%}
  .tools{order:3;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:4px}
  .tsep{width:1px;height:auto;margin:4px 3px}
  .tool .k{display:none}
  .stylebar{order:4}
  .transport{order:5}
  .tc{min-width:0}
  .panel{order:6;min-height:420px;overflow:visible}
  .views{overflow:visible}
  #app.present{display:flex}
  #app.present .center{display:flex;flex-direction:column;flex:1;min-height:0;gap:8px}
  #app.present .stages{flex:1;min-height:0}
  #app.present .stage{aspect-ratio:auto;flex:1}
}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}

/* ================= entraînements ================= */
.modes{flex:none}
.modes button{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;padding:6px 12px}
#trainView{display:none;grid-column:1/-1;grid-row:2;min-height:0;grid-template-columns:250px minmax(0,1fr) 360px;gap:10px}
#app.train #trainView{display:grid}
#app.train .tools,#app.train .center,#app.train .panel,#app.train .vidonly,#app.train #projName{display:none}
.tr-list,.tr-detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-y:auto;min-height:0;padding:12px;display:flex;flex-direction:column;gap:12px}
.tr-list{grid-area:list}.tr-stage{grid-area:stage}.tr-detail{grid-area:detail}
#trainView{grid-template-areas:"list stage detail"}
.tr-head{display:flex;flex-direction:column;gap:8px}
.tr-eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.tr-pname{font-family:var(--f-display);font-size:26px;font-weight:700;text-transform:uppercase;line-height:1}
.tr-theme{font-weight:600;line-height:1.3}
.tr-item .n{white-space:normal;line-height:1.25}
.tr-pause{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-2);padding:6px 9px;border:1px dashed var(--line);border-radius:8px}
.tr-pause .t{font-family:var(--f-mono);font-size:12px}
.tr-stage{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0;overflow-y:auto}
.tr-strip{display:flex;height:30px;border-radius:8px;overflow:hidden;border:1px solid var(--line);flex:none;background:var(--surface)}
.tr-seg{min-width:0;border:0;border-right:2px solid var(--surface);color:#fff;font-family:var(--f-display);font-weight:700;font-size:14px;padding:0;opacity:.6}
.tr-seg:last-child{border-right:0}
.tr-seg.on,.tr-seg:hover{opacity:1}
.tr-seg.on{box-shadow:inset 0 -4px 0 rgba(0,0,0,.35)}
.tr-seg.p{background:repeating-linear-gradient(135deg,var(--surface-2) 0 5px,var(--surface) 5px 10px);cursor:default;opacity:1}
.tr-board{position:relative;width:100%;aspect-ratio:100/85;max-width:100%;background:#C9D3DA;border-radius:var(--r);overflow:hidden;flex:none}
.tr-board canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.tr-viewer{position:absolute;inset:0;z-index:6;background:var(--stage);display:flex;flex-direction:column}
.tr-vbar{display:flex;align-items:center;gap:8px;padding:8px 10px;color:var(--stage-ink);background:rgba(0,0,0,.4)}
.tr-vbar b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tr-vbody{flex:1;min-height:0;display:grid;place-items:center;padding:8px}
.tr-vbody img,.tr-vbody video{max-width:100%;max-height:100%;object-fit:contain}
.tr-range{flex:1;min-width:120px;accent-color:var(--goal)}
.tr-annot{gap:8px}
.tr-tools{display:flex;gap:2px;flex-wrap:wrap}
.tr-tools .tool{width:40px;height:36px}
.tr-hint{flex:1 1 200px}
.tr-dh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tr-dh .t{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.tr-cat{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;color:#fff;background:var(--c)}
.tr-num{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.tr-title{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.02;text-transform:uppercase;margin:2px 0 0;text-wrap:balance}
.tr-blk{display:flex;flex-direction:column;gap:5px;line-height:1.45}
.tr-blk p{margin:0}
.tr-blk ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.tr-pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.tr-pts li{position:relative;padding-left:18px}
.tr-pts li::before{content:"";position:absolute;left:1px;top:.5em;width:9px;height:9px;border-radius:2px;background:var(--c)}
.tr-drop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px dashed var(--line);border-radius:8px;padding:10px}
.tr-drop.over{border-color:var(--blue);background:var(--surface-2)}
.tr-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.tr-thumbs:empty{display:none}
.tr-th{position:relative;display:flex;flex-direction:column;gap:2px;min-width:0}
.tr-thb{position:relative;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--stage);aspect-ratio:16/10;width:100%;max-width:100%}
.tr-thb img,.tr-thb video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tr-play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:20px;text-shadow:0 1px 4px rgba(0,0,0,.7);z-index:1}
.tr-x{position:absolute;top:3px;right:3px;z-index:2;border:0;border-radius:999px;min-width:22px;height:22px;padding:0 6px;background:rgba(10,16,23,.75);color:#fff;font-weight:700;font-size:12px}
.tr-nm{font-size:11px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-link{color:var(--blue);font-size:13px;font-weight:600}
.tr-notes{min-height:84px;resize:vertical;font-family:var(--f-body)}
.tr-errs li::before{background:var(--goal);border-radius:50%}
.tr-vids{display:grid;gap:8px}
.tr-vid{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.tr-vid .fr{position:relative;aspect-ratio:16/9;background:var(--stage);max-width:100%}
.tr-vid .fr img,.tr-vid .fr iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover;display:block}
.tr-vid .fr button{position:absolute;inset:0;border:0;padding:0;background:transparent;display:grid;place-items:center;cursor:pointer}
.tr-vid .pl{position:relative;width:56px;height:40px;border-radius:10px;background:#D7263D;color:#fff;display:grid;place-items:center;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.tr-vid .meta{padding:8px 10px;display:flex;flex-direction:column;gap:2px;line-height:1.3}
.tr-vid .meta b{font-weight:600}
.tr-vid .meta span{font-size:12px;color:var(--ink-2)}
.tr-vid .meta a{font-size:12.5px;color:var(--blue);font-weight:600}
@media (max-width:1180px) and (min-width:861px){
  #trainView{grid-template-columns:260px minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1.3fr);grid-template-areas:"list stage" "detail stage"}
}
@media (max-width:860px){
  #app.train #trainView{display:flex;flex-direction:column;gap:8px}
  .tr-list,.tr-detail,.tr-stage{overflow:visible}
  #trItems{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .tr-item{flex:none;width:210px}
  .modes button{padding:6px 9px}
  #trainView .transport,#trainView .stylebar{order:0}
}

/* panneaux redimensionnables */
#app{column-gap:4px;grid-template-columns:60px minmax(0,1fr) 10px var(--pn,340px);grid-template-areas:"top top top top" "tools center gv panel"}
#app>.tools{margin-right:6px}
#gutV{grid-area:gv}
#app.train #gutV,#app.present #gutV{display:none}
#trainView{column-gap:2px;grid-template-columns:var(--tr-l,250px) 10px minmax(0,1fr) 10px var(--tr-r,360px);grid-template-areas:"list g1 stage g2 detail"}
.gut{position:relative;cursor:col-resize;touch-action:none;display:flex;align-items:center;justify-content:center;border-radius:4px;outline-offset:-2px}
.gut::before{content:"";width:4px;height:56px;border-radius:2px;background:var(--line);transition:background .15s,height .15s}
.gut:hover::before,.gut.drag::before,.gut:focus-visible::before{background:var(--blue);height:96px}
.tr-plan{display:flex;align-items:flex-end;gap:6px;flex-wrap:wrap;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--ice)}
.tr-min{width:96px}
.tr-add{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--ice)}
@media (min-width:861px){.tr-board{width:min(100%,calc((100vh - 230px)*100/85));align-self:center}}
@media (max-width:1180px) and (min-width:861px){
  #trainView{grid-template-columns:var(--tr-l,260px) 10px minmax(0,1fr);grid-template-areas:"list g1 stage" "detail g1 stage"}
  #gutR{display:none}
}
@media (max-width:860px){.gut{display:none!important}}
@media (prefers-reduced-motion: reduce){.gut::before{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">

      <button class="btn vidonly" id="btnCompare" title="Comparer deux séquences côte à côte"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="8" height="14" rx="1.5"/><rect x="13" y="5" width="8" height="14" rx="1.5"/></svg><span class="tx">Comparer</span></button>
      <button class="btn vidonly" id="btnShot" title="Exporter l'image annotée (PNG)"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span class="tx">Capture</span></button>
      <button class="btn vidonly" id="btnRec" title="Exporter la boucle A-B en vidéo annotée"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg><span class="tx" id="recTx">Exporter le clip</span></button>
      <button class="btn vidonly" id="btnPresent" title="Mode présentation plein écran"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg><span class="tx">Présentation</span></button>
    </div>

  <nav class="tools" id="toolbar" aria-label="Outils d'annotation"></nav>

  <main class="center">

      <div class="stage" id="stageA">
        <canvas id="cv"></canvas>
        <div class="badge" id="freezeBadge" hidden><span id="freezeTx">Arrêt sur image</span><span class="bar"><i id="freezeBar"></i></span></div>
        <div class="badge rec" id="recBadge" hidden>● Enregistrement du clip</div>
        <input id="txtIn" class="txtin" hidden placeholder="Texte, puis Entrée" maxlength="40" autocomplete="off">
        <button id="zoneDone" class="chip-float" hidden>Terminer la zone</button>
      </div>
      <div class="stage" id="stageB" hidden><canvas id="cvB"></canvas><span class="tag">B</span></div>
    </div>
    <div class="stylebar" id="stylebar">
      <div class="toolname"><b id="toolName"></b><span id="toolHint"></span></div>

      <button class="btn sm danger" id="btnDelSel" hidden>Supprimer la sélection</button>

    <div class="transport">
      <div class="tl" id="tl"><div class="rail"></div><div class="fill" id="tlFill"></div><div class="loop" id="tlLoop"></div><div id="tlMarks"></div><div class="head" id="tlHead"></div></div>
      <div class="tbtns">
        <span class="tc" id="tc">0:00.00 <small>/ 0:00</small></span>
        <button class="ib" id="bPrevM" title="Arrêt précédent"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 6l-8 6 8 6z"/></svg></button>
        <button class="ib" id="bBack" title="Image précédente (←)"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="ib big" id="bPlay" title="Lecture / pause (Espace)"><svg viewBox="0 0 24 24" id="playIco"><path d="M7 5l12 7-12 7z"/></svg></button>
        <button class="ib" id="bFwd" title="Image suivante (→)"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <button class="ib" id="bNextM" title="Arrêt suivant"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 6l8 6-8 6z"/></svg></button>
        <div class="seg" id="speeds"><button data-r="0.25">¼×</button><button data-r="0.5">½×</button><button data-r="1">1×</button></div>
        <div class="seg"><button id="bA" title="Début de boucle (A)">A</button><button id="bB" title="Fin de boucle (B)">B</button><button id="bLoop" title="Boucle A-B">Boucle</button></div>
        <button class="btn sm" id="bAddM" title="Ajouter un arrêt nommé (M)">+ Arrêt</button>
        <span class="grow"></span>
        <button class="ib" id="bMute" title="Son"><svg viewBox="0 0 24 24" id="muteIco"><path d="M4 10h4l5-4v12l-5-4H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg></button>
        <button class="ib" id="btnExitPresent" title="Quitter la présentation (Échap)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </div>
  </main>
  <div class="gut" id="gutV" role="separator" aria-orientation="vertical" aria-label="Redimensionner le panneau de droite" tabindex="0"></div>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button data-tab="seq" class="active">Arrêts</button>
      <button data-tab="lib">Clips</button>
      <button data-tab="rink">Patinoire</button>
      <button data-tab="proj">Projet</button>
    </div>
    <div class="views">
      <section class="view" data-view="seq" id="vSeq"></section>
      <section class="view" data-view="lib" id="vLib" hidden></section>
      <section class="view" data-view="rink" id="vRink" hidden>
        <div class="row" style="justify-content:space-between"><h3 class="h">Tableau de positionnement</h3><div class="seg"><button id="rkHalf">Demi</button><button id="rkFull">Pleine</button></div></div>
        <div class="rinkwrap"><canvas id="rinkCv"></canvas></div>
        <div class="row">
          <div class="seg" id="rkModes"><button data-m="move" class="active">Déplacer</button><button data-m="skate">Patinage</button><button data-m="pass">Passe</button><button data-m="erase">Gomme</button></div>
        </div>
        <div class="row">
          <button class="btn sm" data-add="x">+ Nous (X)</button>
          <button class="btn sm" data-add="o">+ Adversaire (O)</button>
          <button class="btn sm" data-add="g">+ Gardien</button>
          <button class="btn sm" data-add="p">+ Rondelle</button>

        <div class="edit" id="rkTok" hidden>
          <div class="row"><label class="field" style="flex:1">Étiquette du jeton<input id="rkLabel" maxlength="3"></label><button class="btn sm danger" id="rkDelTok" style="align-self:flex-end">Retirer</button></div>
        </div>
        <label class="opt"><input type="checkbox" id="chkPip"> Afficher la patinoire sur la vidéo</label>
        <h3 class="h">Situations</h3>
        <label class="field">Charger une situation<select id="rkSit"></select></label>
        <div class="row"><input class="inp" id="rkName" placeholder="Nom de la situation" style="flex:1"><button class="btn sm" id="rkSave">Enregistrer</button></div>
        <div class="row"><button class="btn sm" id="rkClearArrows">Effacer les flèches</button><button class="btn sm danger" id="rkDelSit">Supprimer la situation</button></div>
      </section>
      <section class="view" data-view="proj" id="vProj" hidden></section>

  <section id="trainView" aria-label="Entraînements">

</div>

<script>
'use strict';
/* ================= utilitaires ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,10);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>{if(!isFinite(t)||t<0)t=0;const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(2)};
const fmtS=t=>{if(!isFinite(t)||t<0)t=0;const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1)};
const slug=s=>(s||'projet').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'projet';
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const isNarrow=()=>matchMedia('(max-width: 860px)').matches;
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}
const armOrig=new WeakMap();
function armConfirm(btn,fn,label='Confirmer ?'){if(btn.dataset.arm){delete btn.dataset.arm;btn.innerHTML=armOrig.get(btn);fn();return}
  armOrig.set(btn,btn.innerHTML);btn.dataset.arm=1;btn.textContent=label;setTimeout(()=>{if(btn.dataset.arm){delete btn.dataset.arm;btn.innerHTML=armOrig.get(btn)}},3500)}
function lum(hex){const n=parseInt(hex.slice(1),16);const r=(n>>16)/255,g=(n>>8&255)/255,b=(n&255)/255;return .2126*r+.7152*g+.0722*b}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}

/* ================= enregistrement de fichiers ================= */
const dlP=(async()=>{try{return window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){return null}})();
async function saveFile(name,data,mime){
  const dl=await dlP;
  if(dl){try{await dl.save({filename:name,data});toast('Fichier enregistré : '+name);return}
    catch(e){const c=e&&e.code;if(c==='declined'){toast('Enregistrement annulé');return}if(c==='rate_limited'){toast('Une confirmation est déjà ouverte');return}if(c==='too_large'){toast('Fichier trop volumineux pour cet appareil');return}}}
  const blob=data instanceof Blob?data:new Blob([data],{type:mime||'application/octet-stream'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000);toast('Téléchargement : '+name);
}

/* ================= constantes ================= */
const COLORS=[['Jaune','#FFD23F'],['Rouge','#E63946'],['Cyan','#3BCEFF'],['Blanc','#FFFFFF'],['Vert','#3DDC84'],['Orange','#FF8C42'],['Noir','#111418']];
const WIDTHS=[['Fin',3],['Moyen',5],['Épais',8]];
const RINKPAL={ice:'#F7FBFE',red:'#C8102E',blue:'#1D4FA8',board:'#2B3A4A',crease:'#CFE8FA',arena:'#C9D3DA'};
const TOOLS=[
 {id:'select',name:'Sélection',key:'v',g:1,hint:"Touchez une annotation pour la sélectionner, glissez pour la déplacer.",icon:'<path d="M6 3l12 9-5.5 1.2L10 19z"/>'},
 {id:'skate',name:'Patinage',key:'k',g:2,hint:'Tracez le trajet du patineur (trait plein).',icon:'<path d="M4 18c5 0 6-10 14-11"/><path d="M14 4l4.5 3-3.5 4"/>'},
 {id:'carry',name:'Patinage avec rondelle',key:'r',g:2,hint:'Tracez le trajet du porteur de rondelle (trait ondulé).',icon:'<path d="M3 15c1.5-3 3 3 4.5 0s3 3 4.5 0 3 3 4 0"/><path d="M16 11l4 3.5-4.5 2.5"/>'},
 {id:'pass',name:'Passe',key:'p',g:2,hint:'Glissez du passeur vers le receveur (pointillé).',icon:'<path d="M4 19L17 7" stroke-dasharray="3 2.5"/><path d="M12 6h6v6"/>'},
 {id:'shot',name:'Tir',key:'t',g:2,hint:'Glissez du tireur vers la cible (double trait).',icon:'<path d="M3 16L15 6M5 19L17 9"/><path d="M14 3.5l6.5 3.5-4 5.5"/>'},
 {id:'pen',name:'Trait libre',key:'f',g:2,hint:'Dessinez à main levée.',icon:'<path d="M4 19c3-1 4-5 7-8s5-4 9-6"/>'},
 {id:'ring',name:'Anneau au sol',key:'c',g:3,hint:"Glissez à partir des patins du joueur pour tracer l'anneau.",icon:'<ellipse cx="12" cy="17" rx="8" ry="3.2"/><circle cx="12" cy="7" r="2.4"/><path d="M12 9.5V15"/>'},
 {id:'spot',name:'Projecteur',key:'l',g:3,hint:"Glissez à partir du joueur : le reste de l'image s'assombrit.",icon:'<circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2 2M16.7 16.7l2 2M5.3 18.7l2-2M16.7 7.3l2-2"/>'},
 {id:'zone',name:'Zone',key:'z',g:3,hint:'Touchez pour placer les coins; touchez le premier point (ou Entrée) pour fermer.',icon:'<path d="M4 8l9-4 7 7-6 9-9-4z"/>'},
 {id:'cover',name:'Ligne de couverture',key:'d',g:3,hint:"Glissez d'un joueur à l'autre pour montrer l'espace à couvrir.",icon:'<circle cx="5.5" cy="17.5" r="2.2"/><circle cx="18.5" cy="6.5" r="2.2"/><path d="M7.5 16L16.5 8" stroke-dasharray="2.5 2"/>'},
 {id:'text',name:'Étiquette',key:'x',g:3,hint:"Touchez l'endroit où placer le texte ou le numéro.",icon:'<path d="M5 6h14M12 6v13"/>'},

function trimEnd(pts,d){if(pts.length<2)return pts;const e=pts[pts.length-1];let j=pts.length-2;while(j>0&&dist(pts[j],e)<d*1.5)j--;const s=pts[j];const L=dist(s,e)||1;

    if(!g.snapped){snap();g.snapped=true}const du=uv[0]-g.last[0],dv=uv[1]-g.last[1];g.last=uv;
    if(g.mode==='dst'){g.a.dst[0]+=du;g.a.dst[1]+=dv}else translate(g.a,du,dv);return}
  const d=S.draft;if(!d)return;
  if(d.type==='zone'){d.hover=uv;return}
  if(['skate','carry','pen'].includes(d.type)){const l=R.px(d.pts[d.pts.length-1]);if(dist(l,p)>4*(cv.width/cv.getBoundingClientRect().width))d.pts.push(uv);return}
  if(d.pts){d.pts[1]=uv;return}
  if(d.type==='movebox'){d.c=[(d.start[0]+uv[0])/2,(d.start[1]+uv[1])/2];d.rx=Math.abs(p[0]-R.px(d.start)[0])/2/R.h;d.ry=Math.abs(p[1]-R.px(d.start)[1])/2/R.h;return}
  if(d.c){d.r=dist(R.px(d.c),p)/R.h}
});
function endPointer(){
  if(S.drag){if(S.drag.mode!=='none')changed();S.drag=null;return}
  const d=S.draft;if(!d||!RA||d.type==='zone')return;const R=RA;S.draft=null;
  if(d.pts){const q=d.pts.map(R.px);let L=0;for(let i=1;i<q.length;i++)L+=dist(q[i-1],q[i]);if(L<12)return;
    if(['skate','carry','pen'].includes(d.type)){const out=[d.pts[0]];for(let i=1;i<d.pts.length;i++){if(dist(R.px(out[out.length-1]),R.px(d.pts[i]))>=5)out.push(d.pts[i])}if(out[out.length-1]!==d.pts[d.pts.length-1])out.push(d.pts[d.pts.length-1]);d.pts=out}
    commit(d);return}
  if(d.type==='movebox'){if(d.rx*R.h<6||d.ry*R.h<6)return;const s=cur();
    const a={id:d.id,type:'move',color:d.color,w:d.w,src:{c:d.c,rx:d.rx,ry:d.ry},dst:d.c.slice(),anim:S.anim,img:captureEllipse(s,d.c,d.rx,d.ry)};commit(a);
    toast('Glissez maintenant le joueur vers sa position visée');return}
  if(d.c){if(d.r*R.h<6)return;commit(d)}
}
cv.addEventListener('pointerup',endPointer);cv.addEventListener('pointercancel',endPointer);
cv.addEventListener('dblclick',()=>{if(S.draft&&S.draft.type==='zone'&&S.draft.pts.length>=3)finishZone()});
function finishZone(){const d=S.draft;S.draft=null;if(!d||d.pts.length<3)return;delete d.hover;commit(d)}
$('#zoneDone').addEventListener('click',finishZone);
function commit(a){snap();const m=ensureMarker();a.markerId=m.id;a.videoId=P.current;P.annots.push(a);S.sel=a.id;syncStyleUI();changed()}
function setKey(a,t,uv){const T=tol();const k=a.keys.find(k=>Math.abs(k.t-t)<=T);if(k){k.u=uv[0];k.v=uv[1]}else{a.keys.push({t,u:uv[0],v:uv[1]});a.keys.sort((x,y)=>x.t-y.t)}}
function captureEllipse(src,c,rx,ry){const W=src.w,H=src.h;const oc=document.createElement('canvas');oc.width=W;oc.height=H;const o=oc.getContext('2d');src.draw(o,0,0,W,H);
  const cxp=c[0]*W,cyp=c[1]*H,prx=rx*H,pry=ry*H;const sc=Math.min(1,320/(2*Math.max(prx,pry)));const cw=Math.max(2,Math.round(2*prx*sc)),ch=Math.max(2,Math.round(2*pry*sc));
  const cc=document.createElement('canvas');cc.width=cw;cc.height=ch;const x=cc.getContext('2d');x.beginPath();x.ellipse(cw/2,ch/2,cw/2,ch/2,0,0,Math.PI*2);x.clip();
  x.drawImage(oc,cxp-prx,cyp-pry,2*prx,2*pry,0,0,cw,ch);try{return cc.toDataURL('image/png')}catch(e){return null}}

function commitText(){const inp=$('#txtIn');const v=inp.value.trim();const at=S.textAt;hideText();if(v&&at)commit({id:uid(),type:'text',color:S.color,w:S.width,pos:at,text:v})}

function removeVideo(id){P.videos=P.videos.filter(v=>v.id!==id);P.markers=P.markers.filter(m=>m.videoId!==id);P.annots=P.annots.filter(a=>a.videoId!==id);P.clips=P.clips.filter(c=>c.videoId!==id);

document.addEventListener('keydown',e=>{const tg=e.target;if(tg&&(tg.tagName==='INPUT'||tg.tagName==='SELECT'||tg.tagName==='TEXTAREA'))return;
  if($('#app').classList.contains('train'))return;
  const k=e.key;
  if((e.ctrlKey||e.metaKey)&&(k==='z'||k==='Z')){e.preventDefault();e.shiftKey?redo():undo();return}
  if((e.ctrlKey||e.metaKey)&&(k==='y'||k==='Y')){e.preventDefault();redo();return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(k===' '){e.preventDefault();togglePlay();return}
  if(k==='ArrowLeft'){e.preventDefault();step(-1,e.shiftKey?1:0);return}
  if(k==='ArrowRight'){e.preventDefault();step(1,e.shiftKey?1:0);return}
  if(k==='['){setA();return} if(k===']'){setB();return}
  if(k==='Escape'){if(S.draft){S.draft=null;return}if($('#app').classList.contains('present'))setPresent(false);return}
  if(k==='Enter'&&S.draft&&S.draft.type==='zone'){finishZone();return}
  if((k==='Delete'||k==='Backspace')&&S.sel){e.preventDefault();$('#btnDelSel').click();return}
  if(k==='m'||k==='M'){addMarker();return}
  const t=TOOLS.find(t=>t.key===k.toLowerCase());if(t)setTool(t.id)});

function drawRinkScene(ctx,x,y,W,H,st,half){const fx=half?100:200;const k=Math.min(W/fx,H/85)*.97;const ox=x+(W-fx*k)/2,oy=y+(H-85*k)/2;
  ctx.save();ctx.beginPath();ctx.rect(x,y,W,H);ctx.clip();ctx.translate(ox,oy);ctx.scale(k,k);drawRinkFt(ctx);ctx.restore();
  const px=p=>[ox+p[0]*k,oy+p[1]*k];ctx.save();ctx.beginPath();ctx.rect(x,y,W,H);ctx.clip();
  (st.arrows||[]).forEach(a=>arrow(ctx,a.pts.map(px),{color:'#0F1B28',w:Math.max(1.6,.42*k),head:true,dash:a.type==='pass',smooth:true,outline:false}));
  if(rk.draft&&ctx===rkCtx)arrow(ctx,rk.draft.pts.map(px),{color:'#1D5FC2',w:Math.max(1.6,.42*k),head:true,dash:rk.draft.type==='pass',smooth:true,outline:false});
  (st.tokens||[]).forEach(t=>{const [cx_,cy_]=px([t.x,t.y]);const st_=TOK[t.team];const r=(t.team==='p'?.9:2.5)*k;
    ctx.beginPath();ctx.arc(cx_,cy_,r,0,Math.PI*2);ctx.fillStyle=st_.fill;ctx.fill();ctx.lineWidth=Math.max(1,.3*k);ctx.strokeStyle=st_.stroke;ctx.stroke();
    if(ctx===rkCtx&&rk.sel===t.id){ctx.beginPath();ctx.arc(cx_,cy_,r+3,0,Math.PI*2);ctx.lineWidth=2;ctx.strokeStyle='#1D5FC2';ctx.stroke()}
    if(t.label){ctx.fillStyle=st_.ink;ctx.font=`700 ${Math.max(8,(t.label.length>1?2.3:2.9)*k)}px "Barlow Condensed","Arial Narrow",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.label,cx_,cy_+.1*k)}});
  ctx.restore();return{k,ox,oy}}

  rkCtx.fillStyle=RINKPAL.arena;rkCtx.fillRect(0,0,W,H);if(!P.rink.current)P.rink.current=clone(PRESETS[3]);rk.T=drawRinkScene(rkCtx,0,0,W,H,P.rink.current,half)}

  if(rk.mode==='move'){const t=rkHitTok(f);rk.sel=t?t.id:null;if(t)rk.drag={t,dx:t.x-f[0],dy:t.y-f[1]};renderRinkTok()}
  else if(rk.mode==='erase'){const t=rkHitTok(f);if(t){st.tokens=st.tokens.filter(x=>x!==t)}else{let best=null,bd=4;st.arrows.forEach(a=>{for(let j=1;j<a.pts.length;j++){const d=distSeg(f,a.pts[j-1],a.pts[j]);if(d<bd){bd=d;best=a}}});if(best)st.arrows=st.arrows.filter(a=>a!==best)}rkChanged()}
  else rk.draft={type:rk.mode,pts:[f,f.slice()]};drawRinkPanel()});

  if(rk.drag){rk.drag.t.x=clamp(f[0]+rk.drag.dx,1,199);rk.drag.t.y=clamp(f[1]+rk.drag.dy,1,84);drawRinkPanel();return}

/* préparation : pieds, tracés densifiés, longueurs */
const trFt=([x,y])=>[100-x/6.1,y*85/520];
function trDense(p){if(p.length<3)return resample(p,.6);const o=[];
  for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;
    for(let s=0;s<8;s++){const t=s/8,t2=t*t,t3=t2*t;o.push([0,1].map(j=>.5*(2*p1[j]+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3)))}}
  o.push(p[p.length-1].slice());return o}
function trPrep(d){if(d.pause||d._ok)return;d.tokens.forEach(t=>{const f=trFt([t.x,t.y]);t.fx=f[0];t.fy=f[1]});
  d.moves.forEach(m=>{m.ft=m.pts.map(trFt);m.dense=trDense(m.ft);m.cum=[0];for(let i=1;i<m.dense.length;i++)m.cum.push(m.cum[i-1]+dist(m.dense[i-1],m.dense[i]));m.L=m.cum[m.cum.length-1]||1});

function trAt(m,f){const L=m.L*f;let i=1;while(i<m.cum.length-1&&m.cum[i]<L)i++;const a=m.dense[i-1],b=m.dense[i],seg=(m.cum[i]-m.cum[i-1])||1,u=clamp((L-m.cum[i-1])/seg,0,1);return{i,p:[lerp(a[0],b[0],u),lerp(a[1],b[1],u)]}}
function trPartial(m,f){if(f>=1)return m.dense;const r=trAt(m,f);return m.dense.slice(0,r.i).concat([r.p])}

/* état et sauvegarde */
const TR={pi:0,di:null,t:0,playing:false,speed:1,last:0,rest:true,tool:null,color:'#FFD23F',draft:null,R:null,raf:0,textAt:null};
let TRS={notes:{},annots:{},meta:{},plans:{}};
function trLoad(){try{const o=JSON.parse(localStorage.getItem('bvh:entrainements')||'null');if(o&&typeof o==='object')TRS=Object.assign(TRS,o)}catch(e){}}
let trSaveT;function trSave(){clearTimeout(trSaveT);trSaveT=setTimeout(()=>{try{localStorage.setItem('bvh:entrainements',JSON.stringify(TRS))}catch(e){toast('Sauvegarde des notes impossible sur cet appareil')}},400)}
const trPrat=()=>PRATIQUES[TR.pi];
const trDrill=()=>trItems(trPrat()).find(d=>d.id===TR.di);
/* plan modifiable des pratiques (ordre, durées, exercices ajoutés de la banque) */
const TR_BYID={};PRATIQUES.forEach(p=>p.items.forEach(d=>{TR_BYID[d.id]=d}));
const trIsB=pr=>pr.kind==='banque';
const trPlan=pr=>(TRS.plans&&TRS.plans[pr.id])||pr.items.map(d=>({ref:d.id,min:d.end-d.start}));
function trItems(pr){if(trIsB(pr)||!(TRS.plans&&TRS.plans[pr.id]))return pr.items;const key=pr.id+JSON.stringify(TRS.plans[pr.id]);if(TR._ic&&TR._ic.k===key)return TR._ic.v;
  let t=0;const v=trPlan(pr).map(p=>{const b=TR_BYID[p.ref];if(!b)return null;const it=Object.assign({},b,{start:t,end:t+p.min});t+=p.min;return it}).filter(Boolean);TR._ic={k:key,v};return v}
function trPlanEdit(pr,fn){if(!TRS.plans)TRS.plans={};const pl=trPlan(pr).map(x=>Object.assign({},x));fn(pl);TRS.plans[pr.id]=pl;trSave()}
const trTotal=pr=>trItems(pr).reduce((a,d)=>a+(d.end-d.start),0);
const trDefMin=d=>{const n=String(d.dur||'').match(/\d+/g);return n?Math.max(...n.map(Number)):8};
function trPlanCtl(d){return `<div class="tr-plan"><label class="field tr-min">Durée (min)<input type="number" id="trMin" min="1" max="30" step="1" value="${d.end-d.start}"></label>
  <button class="btn sm" id="trUp">↑ Monter</button><button class="btn sm" id="trDown">↓ Descendre</button><button class="btn sm danger" id="trRem">Retirer</button></div>`}
function trAddForm(d){const ps=PRATIQUES.map((p,i)=>[p,i]).filter(([p])=>!trIsB(p));
  return `<div class="tr-blk tr-add"><h3 class="h">Ajouter à une pratique</h3>
  <div class="grid2"><label class="field">Pratique<select id="trAddP">${ps.map(([p,i])=>`<option value="${i}">${esc(p.name)}</option>`).join('')}</select></label>
  <label class="field">Durée (min)<input type="number" id="trAddM" min="1" max="30" step="1" value="${trDefMin(d)}"></label></div>
  <label class="field">Placer après<select id="trAddAfter"></select></label>
  <button class="btn sm primary" id="trAddGo">Ajouter à la pratique</button></div>`}
function trWirePlan(d){const pr=trPrat();
  if(trIsB(pr)){const selP=$('#trAddP'),selA=$('#trAddAfter');if(!selP)return;
    const fill=()=>{const tp=PRATIQUES[+selP.value];const its=trItems(tp);let def=its.length-1;its.forEach((x,i)=>{if(x.cat===d.cat)def=i});
      selA.innerHTML=`<option value="-1">Au début</option>`+its.map((x,i)=>`<option value="${i}">${x.start}–${x.end}′ · ${esc(x.title)}</option>`).join('');selA.value=String(def)};
    selP.onchange=fill;fill();
    $('#trAddGo').onclick=()=>{const pi=+selP.value,tp=PRATIQUES[pi];if(trPlan(tp).some(x=>x.ref===d.id))return toast('Cet exercice est déjà dans '+tp.name);
      const min=clamp(Math.round(+$('#trAddM').value||trDefMin(d)),1,30),at=+selA.value+1;
      trPlanEdit(tp,pl=>pl.splice(at,0,{ref:d.id,min}));TR.pi=pi;try{localStorage.setItem('bvh:trprat',pi)}catch(e){}

    return}
  const mi=$('#trMin');if(!mi)return;
  mi.onchange=()=>{const v=clamp(Math.round(+mi.value||1),1,30);mi.value=v;trPlanEdit(pr,pl=>{const x=pl.find(x=>x.ref===d.id);if(x)x.min=v});
    trRenderList();const n=trDrill();if(n)$('#trDhT').textContent=`${n.start}:00–${n.end}:00 · ${n.end-n.start} min`};
  const mv=dir=>{trPlanEdit(pr,pl=>{const i=pl.findIndex(x=>x.ref===d.id),j=i+dir;if(i<0||j<0||j>=pl.length)return;const t=pl[i];pl[i]=pl[j];pl[j]=t});trSelect(d.id)};
  $('#trUp').onclick=()=>mv(-1);$('#trDown').onclick=()=>mv(1);
  $('#trRem').onclick=e=>armConfirm(e.currentTarget,()=>{trPlanEdit(pr,pl=>{const i=pl.findIndex(x=>x.ref===d.id);if(i>=0)pl.splice(i,1)});
    const f=trItems(pr).find(x=>!x.pause);if(f)trSelect(f.id);toast(`Retiré · durée totale ${trTotal(pr)} min`)},'Retirer ?')}
/* panneaux redimensionnables */
const LAYDEF={pn:340,trL:250,trR:360};const LAY=Object.assign({},LAYDEF);
try{Object.assign(LAY,JSON.parse(localStorage.getItem('bvh:layout')||'{}'))}catch(e){}
function layApply(){$('#app').style.setProperty('--pn',LAY.pn+'px');const tv=$('#trainView');tv.style.setProperty('--tr-l',LAY.trL+'px');tv.style.setProperty('--tr-r',LAY.trR+'px')}
function laySave(){try{localStorage.setItem('bvh:layout',JSON.stringify(LAY))}catch(e){}}
function gutter(el,key,calc,maxW){
  const set=v=>{LAY[key]=Math.round(clamp(v,LAYDEF[key]*.6,Math.max(LAYDEF[key]*.6,maxW())));layApply()};
  el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);el.classList.add('drag');document.body.style.cursor='col-resize';
    const mv=ev=>set(calc(ev.clientX));
    const up=()=>{el.classList.remove('drag');document.body.style.cursor='';el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);laySave()};
    el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)});
  el.addEventListener('dblclick',()=>{LAY[key]=LAYDEF[key];layApply();laySave()});
  el.addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;e.preventDefault();e.stopPropagation();
    const r=el.getBoundingClientRect(),x=r.left+r.width/2+(e.key==='ArrowRight'?24:-24);set(calc(x));laySave()});
  el.title='Glisser pour redimensionner · double-clic : taille par défaut'}
function layInit(){layApply();const A=()=>$('#app').getBoundingClientRect(),T=()=>$('#trainView').getBoundingClientRect();
  gutter($('#gutV'),'pn',x=>A().right-16-x,()=>A().width-60-420);
  gutter($('#gutL'),'trL',x=>x-T().left,()=>T().width-LAY.trR-340);
  gutter($('#gutR'),'trR',x=>T().right-x,()=>T().width-LAY.trL-340)}
const trOn=()=>$('#app').classList.contains('train');

/* rendu du schéma */
const trCv=$('#trCv'),trCtx=trCv.getContext('2d');
const TR_INK='#0F1B28';
function trTok(c,t,xy,k){const x=xy[0],y=xy[1];c.save();
  if(t.k==='cone'){const s=1.3*k;c.beginPath();c.moveTo(x-s,y+s);c.lineTo(x,y-s*1.3);c.lineTo(x+s,y+s);c.closePath();c.fillStyle='#E8761A';c.fill();c.lineWidth=1;c.strokeStyle='#8A3E05';c.stroke();c.restore();return}
  const st=t.k==='a'?TOK.x:t.k==='b'?TOK.o:t.k==='g'?TOK.g:t.k==='puck'?TOK.p:{fill:'#2F3B48',stroke:'#0F1B28',ink:'#FFFFFF'};const r=(t.k==='puck'?.9:2.5)*k;
  c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle=st.fill;c.fill();c.lineWidth=Math.max(1,.3*k);c.strokeStyle=st.stroke;c.stroke();
  const lab=t.k==='g'?'G':t.l;if(lab&&t.k!=='puck'){c.fillStyle=st.ink;c.font=`700 ${Math.max(8,(lab.length>1?2.3:2.9)*k)}px "Barlow Condensed","Arial Narrow",sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(lab,x,y+.1*k)}
  c.restore()}
function trTicks(c,pts,w,k){const r=resample(pts,3.4*k);c.save();c.strokeStyle=TR_INK;c.lineWidth=w*.8;c.lineCap='round';
  for(let i=1;i<r.length-2;i++){const a=r[i-1],b=r[i+1],ang=Math.atan2(b[1]-a[1],b[0]-a[0]),q=r[i],l=w*2.1;c.beginPath();c.moveTo(q[0]-Math.sin(ang)*l,q[1]+Math.cos(ang)*l);c.lineTo(q[0]+Math.sin(ang)*l,q[1]-Math.cos(ang)*l);c.stroke()}c.restore()}
function trDisc(c,a,R){const p=R.px(a.c),r=a.r*R.h;c.save();c.beginPath();c.arc(p[0],p[1],r,0,Math.PI*2);c.fillStyle=hexA(a.color,.22);c.fill();
  c.lineWidth=a.w*R.s*.7+3;c.strokeStyle='rgba(0,0,0,.45)';c.stroke();c.lineWidth=a.w*R.s*.7;c.strokeStyle=a.color;c.stroke();c.restore()}
const trDrawA=(c,a,R)=>a.type==='disc'?trDisc(c,a,R):(DRAW[a.type]&&DRAW[a.type](c,a,R));
function trRender(){const d=trDrill();if(!d||d.pause||!trOn())return;fit(trCv);const c=trCtx,W=trCv.width,H=trCv.height;
  c.fillStyle=RINKPAL.arena;c.fillRect(0,0,W,H);
  const k=Math.min(W/100,H/85)*.97,ox=(W-100*k)/2,oy=(H-85*k)/2;
  c.save();c.beginPath();c.rect(0,0,ox+100.5*k,H);c.clip();c.translate(ox,oy);c.scale(k,k);drawRinkFt(c);c.restore();
  const px=p=>[ox+p[0]*k,oy+p[1]*k];
  [20,42.5,65].forEach(y=>trTok(c,{k:'cone'},px([97.6,y]),k));
  c.save();c.font=`600 ${Math.max(9,1.7*k)}px "IBM Plex Mono",monospace`;c.fillStyle='rgba(15,27,40,.55)';c.textAlign='right';c.textBaseline='middle';const lp=px([96,4.2]);c.fillText('AUTRE ÉQUIPE ▸',lp[0],lp[1]);c.restore();
  const w=Math.max(1.6,.42*k);
  d.moves.forEach(m=>{const f=TR.rest?1:clamp((TR.t-m.t)/m.d,0,1);if(f<=0)return;const pts=trPartial(m,f).map(px);if(pts.length<2||dist(pts[0],pts[pts.length-1])<2)return;
    if(m.k==='shot')arrow(c,[pts[0],pts[pts.length-1]],{color:'#C8102E',w:w*1.1,head:true,kind:'double',outline:false});
    else if(m.k==='carry')arrow(c,pts,{color:TR_INK,w,head:true,kind:'wavy',outline:false});
    else if(m.k==='pass')arrow(c,pts,{color:TR_INK,w,head:true,dash:true,outline:false});
    else{arrow(c,pts,{color:TR_INK,w,head:true,outline:false});if(m.k==='back')trTicks(c,pts,w,k)}});
  const ord=[...d.tokens.filter(t=>t.k==='cone'),...d.tokens.filter(t=>t.k!=='cone'&&t.k!=='puck'),...d.tokens.filter(t=>t.k==='puck')];
  ord.forEach(t=>{let p=[t.fx,t.fy];
    if(!TR.rest)d.moves.forEach(m=>{if((m.w!==t.id&&m.pk!==t.id)||TR.t<m.t)return;p=trAt(m,clamp((TR.t-m.t)/m.d,0,1)).p;if(m.pk===t.id&&m.w)p=[p[0]-1.2,p[1]+1.2]});
    trTok(c,t,px(p),k)});
  const R=mkR(ox,oy,100*k,85*k);TR.R=R;
  (TRS.annots[d.id]||[]).forEach(a=>trDrawA(c,a,R));if(TR.draft)trDrawA(c,TR.draft,R);
  const tt=TR.rest?d.total:TR.t;$('#trRange').value=Math.round(tt/d.total*1000);$('#trTime').textContent=tt.toFixed(1).replace('.',',')+' s'}

function trClipHtml(c){const full='https://www.youtube.com/watch?v='+c.id;
  return `<div class="tr-blk"><h3 class="h">Séquence de l'exercice · ${c.start}–${c.end} s</h3><div class="tr-vid">${TR_EMBED?`<div class="fr" id="trClipFr"><button data-trclip="1" aria-label="Lire la séquence"><img src="https://i.ytimg.com/vi/${c.id}/hqdefault.jpg" alt="" loading="lazy"><span class="pl">▶</span></button></div>`:''}
    <div class="meta">${TR_EMBED?'<button class="btn sm" id="trClipAgain" style="align-self:flex-start">↺ Rejouer la séquence</button>':`<a href="${full}&t=${c.start}s" target="_blank" rel="noopener">Voir la séquence (${c.start}–${c.end} s) sur YouTube ↗</a>`}<span>${esc(c.by||'')}</span><a href="${full}" target="_blank" rel="noopener">Vidéo complète sur YouTube ↗</a></div></div></div>`}
/* vidéos YouTube : intégrées dans l'app autonome, en lien dans la copie Claude (les intégrations y sont bloquées) */
const TR_EMBED=!window.claude&&!/claude/.test(location.hostname)&&location.protocol==='https:';
function trVidCard(v){const url='https://www.youtube.com/watch?v='+v.id;
  return `<div class="tr-vid">${TR_EMBED?`<div class="fr"><button data-ytp="${v.id}" aria-label="Lire « ${esc(v.title)} »"><img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" alt="" loading="lazy"><span class="pl">▶</span></button></div>`:''}
    <div class="meta"><b>${esc(v.title)}</b><span>${esc(v.by)}${v.note?' · '+esc(v.note):''}</span><a href="${url}" target="_blank" rel="noopener">Ouvrir sur YouTube ↗</a></div></div>`}
function trSelect(id){const d=trItems(trPrat()).find(x=>x.id===id);if(!d||d.pause)return;TR.di=id;TR.playing=false;TR.rest=true;TR.t=d.total;TR.draft=null;trHideText();trCloseView();
  try{localStorage.setItem('bvh:trdrill',id)}catch(e){}trRenderList();trDetail();trSync();trRender();
  const it=$(`#trItems [data-tri="${id}"]`);it&&it.scrollIntoView({block:'nearest',inline:'nearest'})}

/* médias (gardés sur cet appareil) */
let trDBp=null;const trMem=[];const trUrls=new Map();let trWarned=false;
function trDB(){return trDBp||(trDBp=new Promise((res,rej)=>{try{const r=indexedDB.open('bvh-entrainements',1);r.onupgradeneeded=()=>r.result.createObjectStore('media',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}))}
async function trMediaList(drill){let out=[];try{const db=await trDB();out=await new Promise(res=>{const o=[];const rq=db.transaction('media').objectStore('media').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){if(c.value.drill===drill)o.push(c.value);c.continue()}else res(o)};rq.onerror=()=>res(o)})}catch(e){}
  return out.concat(trMem.filter(m=>m.drill===drill)).sort((a,b)=>a.added-b.added)}
async function trMediaPut(rec){try{const db=await trDB();await new Promise((res,rej)=>{const tx=db.transaction('media','readwrite');tx.objectStore('media').put(rec);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
  catch(e){trMem.push(rec);if(!trWarned){trWarned=true;toast('Médias gardés pour cette séance seulement')}}}
async function trMediaDel(id){const i=trMem.findIndex(m=>m.id===id);if(i>=0){trMem.splice(i,1);return}
  try{const db=await trDB();await new Promise(res=>{const tx=db.transaction('media','readwrite');tx.objectStore('media').delete(id);tx.oncomplete=res;tx.onerror=res})}catch(e){}}
function trUrl(m){if(!trUrls.has(m.id))trUrls.set(m.id,URL.createObjectURL(m.blob));return trUrls.get(m.id)}
async function trMedia(){const d=trDrill();const list=await trMediaList(d.id);const box=$('#trThumbs');if(!box||!trDrill()||trDrill().id!==d.id)return;
  box.innerHTML=list.map(m=>`<div class="tr-th"><button class="tr-thb" data-trm="${m.id}" aria-label="Ouvrir ${esc(m.name)}">${m.type.startsWith('video')?'<span class="tr-play">▶</span>':''}</button><button class="tr-x" data-trx="${m.id}" title="Retirer" aria-label="Retirer ${esc(m.name)}">×</button><span class="tr-nm">${esc(m.name)}</span></div>`).join('');
  list.forEach(m=>{const b=box.querySelector(`[data-trm="${m.id}"]`);const isV=m.type.startsWith('video');const el=document.createElement(isV?'video':'img');el.src=trUrl(m);
    if(isV){el.muted=true;el.preload='metadata';el.playsInline=true}else el.alt='';b.prepend(el);b.onclick=()=>trView(m)});
  $$('[data-trx]',box).forEach(b=>b.onclick=()=>armConfirm(b,async()=>{await trMediaDel(b.dataset.trx);trMedia()},'Retirer ?'))}
async function trAddFiles(files){const d=trDrill();let n=0;for(const f of files){if(!/^(image|video)\//.test(f.type))continue;n++;await trMediaPut({id:'m_'+uid(),drill:d.id,name:f.name,type:f.type,blob:f,added:Date.now()})}
  if(n)toast(n>1?n+' médias ajoutés':'Média ajouté');else toast('Ajoutez une photo ou une vidéo');trMedia()}
function trView(m){const v=$('#trViewer');const isV=m.type.startsWith('video');v.hidden=false;
  v.innerHTML=`<div class="tr-vbar"><b>${esc(m.name)}</b><span class="grow"></span>${isV?'<button class="btn sm primary" id="trToVid">Analyser dans le banc vidéo</button>':''}<button class="btn sm" id="trVClose">Fermer</button></div><div class="tr-vbody"></div>`;
  const el=document.createElement(isV?'video':'img');el.src=trUrl(m);if(isV){el.controls=true;el.playsInline=true}else el.alt=m.name;$('.tr-vbody',v).appendChild(el);
  $('#trVClose').onclick=trCloseView;if(isV)$('#trToVid').onclick=()=>{trCloseView();trToVideo(m)}}
function trCloseView(){const v=$('#trViewer');if(!v||v.hidden)return;const vid=v.querySelector('video');vid&&vid.pause();v.hidden=true;v.innerHTML=''}
function trToVideo(m){const id='v_'+uid();fileURLs[id]=URL.createObjectURL(m.blob);P.videos.push({id,name:m.name,kind:'file',duration:0});setMode('video');switchVideo(id);toast('Vidéo ouverte : '+m.name)}
function trToRink(){const d=trDrill();if(!d)return;const map={a:'x',b:'o',g:'g',puck:'p'};
  const tokens=d.tokens.filter(t=>map[t.k]).map(t=>({id:uid(),team:map[t.k],label:t.k==='puck'?'':(t.k==='g'?'G':(t.l||TOK[map[t.k]].def)),x:+t.fx.toFixed(1),y:+t.fy.toFixed(1)}));
  const arrows=d.moves.map(m=>({type:m.k==='pass'||m.k==='shot'?'pass':'skate',pts:m.ft.map(p=>[+p[0].toFixed(1),+p[1].toFixed(1)])}));
  P.rink.current={tokens,arrows};P.rink.half=true;rk.sel=null;$('#rkName').value=d.title;setMode('video');setTab('rink');renderRinkUI();autosave();toast('Exercice envoyé au tableau Patinoire')}

/* annotation du schéma (outils de l'app) */
const TR_TOOLS=['skate','carry','pass','shot','pen','cover','disc','text','eraser'];
const TR_DISC={id:'disc',name:'Zone ronde',hint:'Glissez à partir du centre pour encercler une zone de glace.',icon:'<circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/>'};
const trToolDef=id=>id==='disc'?TR_DISC:TOOLS.find(t=>t.id===id);
function trBuildTools(){$('#trTools').innerHTML=TR_TOOLS.map(id=>{const t=trToolDef(id);return `<button class="tool" data-trt="${id}" title="${esc(t.name)}" aria-label="${esc(t.name)}"><svg viewBox="0 0 24 24">${t.icon}</svg></button>`}).join('');
  $$('[data-trt]').forEach(b=>b.onclick=()=>{TR.tool=TR.tool===b.dataset.trt?null:b.dataset.trt;trHideText();trToolUI()});
  $('#trSw').innerHTML=COLORS.slice(0,5).map(([n,h])=>`<button class="sw" data-trc="${h}" title="${n}" aria-label="${n}" style="background:${h}"></button>`).join('');
  $$('[data-trc]').forEach(b=>b.onclick=()=>{TR.color=b.dataset.trc;trToolUI()})}
function trToolUI(){$$('[data-trt]').forEach(b=>b.classList.toggle('active',b.dataset.trt===TR.tool));$$('[data-trc]').forEach(b=>b.classList.toggle('active',b.dataset.trc===TR.color));
  trCv.style.cursor=TR.tool?'crosshair':'default';
  $('#trHint').textContent=TR.tool?(TR.tool==='eraser'?"Touchez une annotation pour l'effacer.":trToolDef(TR.tool).hint):"Choisissez un outil pour annoter le schéma. Les annotations restent avec l'exercice."}
const trUV=e=>TR.R?TR.R.uv(evPt(e,trCv)):[0,0];
function trHideText(){const i=$('#trTxt');if(i){i.hidden=true;i.value=''}TR.textAt=null}
function trCommitText(){const i=$('#trTxt');const v=i.value.trim();if(v&&TR.textAt){const d=trDrill();(TRS.annots[d.id]=TRS.annots[d.id]||[]).push({id:uid(),type:'text',color:TR.color,w:6,pos:TR.textAt,text:v});trSave()}trHideText();trRender()}
function trErase(p){const d=trDrill(),R=TR.R,L=TRS.annots[d.id]||[];let best=-1,bd=18*(trCv.width/trCv.getBoundingClientRect().width);
  L.forEach((a,i)=>{let dd=1e9;if(a.pts){const q=a.pts.map(R.px);for(let j=1;j<q.length;j++)dd=Math.min(dd,distSeg(p,q[j-1],q[j]))}
    else if(a.c){const cc=R.px(a.c),r=a.r*R.h,dc=dist(p,cc);dd=dc<r?0:dc-r}else if(a.pos)dd=Math.max(0,dist(p,R.px(a.pos))-24);if(dd<bd){bd=dd;best=i}});
  if(best>=0){L.splice(best,1);trSave();trRender()}}
trCv.addEventListener('pointerdown',e=>{const d=trDrill();if(!d||!TR.tool||!TR.R)return;e.preventDefault();
  if(TR.tool==='eraser'){trErase(evPt(e,trCv));return}
  if(TR.tool==='text'){if(TR.textAt)trCommitText();const r=$('#trBoard').getBoundingClientRect(),i=$('#trTxt');TR.textAt=trUV(e);i.style.left=clamp(e.clientX-r.left,4,r.width-190)+'px';i.style.top=clamp(e.clientY-r.top-18,4,r.height-44)+'px';i.hidden=false;i.value='';setTimeout(()=>i.focus(),0);return}
  trCv.setPointerCapture(e.pointerId);const uv=trUV(e);const base={id:uid(),type:TR.tool,color:TR.color,w:6};
  TR.draft=TR.tool==='disc'?Object.assign(base,{c:uv,r:0}):Object.assign(base,{pts:[uv,uv.slice()]});trRender()});
trCv.addEventListener('pointermove',e=>{const a=TR.draft;if(!a)return;const uv=trUV(e),R=TR.R;
  if(a.type==='disc')a.r=Math.hypot((uv[0]-a.c[0])*R.w,(uv[1]-a.c[1])*R.h)/R.h;
  else if(a.type==='pass'||a.type==='shot'||a.type==='cover')a.pts[1]=uv;
  else{const l=a.pts[a.pts.length-2]||a.pts[0];if(Math.hypot((uv[0]-l[0])*R.w,(uv[1]-l[1])*R.h)>5)a.pts.push(uv);else a.pts[a.pts.length-1]=uv}
  trRender()});
const trUp=()=>{const a=TR.draft;if(!a)return;TR.draft=null;const R=TR.R;let ok;
  if(a.type==='disc')ok=a.r*R.h>8;else{const p=a.pts[0],q=a.pts[a.pts.length-1];ok=Math.hypot((p[0]-q[0])*R.w,(p[1]-q[1])*R.h)>10}
  if(ok){const d=trDrill();(TRS.annots[d.id]=TRS.annots[d.id]||[]).push(a);trSave()}trRender()};
trCv.addEventListener('pointerup',trUp);trCv.addEventListener('pointercancel',trUp);

/* mode */
function setMode(m){const tr=m==='train';$('#app').classList.toggle('train',tr);$('#modeVid').classList.toggle('active',!tr);$('#modeTrain').classList.toggle('active',tr);
  $('#modeVid').setAttribute('aria-pressed',!tr);$('#modeTrain').setAttribute('aria-pressed',tr);
  try{localStorage.setItem('bvh:mode',m)}catch(e){}
  if(tr){try{pauseAll()}catch(e){}trRenderList();trDetail();trSync();requestAnimationFrame(trRender)}
  else{TR.playing=false;trSync();trCloseView();trHideText();requestAnimationFrame(drawRinkPanel)}}
function trInit(){trLoad();layInit();trBuildTools();PRATIQUES.forEach(p=>p.items.forEach(trPrep));
  let di=null;try{di=localStorage.getItem('bvh:trdrill');const pi=+localStorage.getItem('bvh:trprat');if(PRATIQUES[pi])TR.pi=pi}catch(e){}
  const pr=trPrat();TR.di=trItems(pr).some(d=>d.id===di&&!d.pause)?di:trItems(pr).find(d=>!d.pause).id;TR.t=trDrill().total;
  $('#modeVid').onclick=()=>setMode('video');$('#modeTrain').onclick=()=>setMode('train');
  $('#trPlay').onclick=trToggle;$('#trRestart').onclick=()=>{TR.playing=false;TR.rest=false;TR.t=0;trToggle()};
  $$('#trSpeed button').forEach(b=>b.onclick=()=>{TR.speed=+b.dataset.trs;$$('#trSpeed button').forEach(x=>x.classList.toggle('active',x===b))});
  $('#trRange').addEventListener('input',e=>{const d=trDrill();TR.playing=false;TR.rest=false;TR.t=e.target.value/1000*d.total;trSync();trRender()});
  $('#trUndo').onclick=()=>{const L=TRS.annots[TR.di];if(L&&L.length){L.pop();trSave();trRender()}};
  $('#trClear').onclick=e=>{const L=TRS.annots[TR.di];if(!L||!L.length)return;armConfirm(e.currentTarget,()=>{TRS.annots[TR.di]=[];trSave();trRender()},'Tout effacer ?')};
  $('#trToRink').onclick=trToRink;
  const ti=$('#trTxt');ti.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')trCommitText();if(e.key==='Escape')trHideText()});ti.addEventListener('blur',()=>{if(TR.textAt)trCommitText()});
  const dv=$('#trDetail');
  dv.addEventListener('input',e=>{if(e.target.id==='trNotes'){TRS.notes[TR.di]=e.target.value;trSave()}});
  dv.addEventListener('change',e=>{if(e.target.id==='trFile'){const f=[...e.target.files];e.target.value='';if(f.length)trAddFiles(f)}});
  dv.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('#trDrop');if(z){e.preventDefault();z.classList.add('over')}});
  dv.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('#trDrop');z&&z.classList.remove('over')});
  dv.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('#trDrop');if(!z)return;e.preventDefault();z.classList.remove('over');trAddFiles([...e.dataTransfer.files])});
  document.addEventListener('keydown',e=>{if(!trOn())return;const tg=e.target;if(tg&&(tg.tagName==='INPUT'||tg.tagName==='SELECT'||tg.tagName==='TEXTAREA'))return;
    if(e.key===' '){e.preventDefault();trToggle()}else if(e.key==='Escape'){if(!$('#trViewer').hidden)trCloseView();else if(TR.tool){TR.tool=null;trToolUI()}}
    else if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z')){e.preventDefault();$('#trUndo').click()}});
  new ResizeObserver(()=>trRender()).observe($('#trBoard'));
  trToolUI();trSync();
  let m=null;try{m=localStorage.getItem('bvh:mode')}catch(e){}if(m==='train')setMode('train');
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>trRender())}

/* ================= démarrage ================= */
(function init(){
  buildToolbar();
  let loaded=null;try{const raw=localStorage.getItem('bvh:projet');if(raw){const o=JSON.parse(raw);if(o&&o.app==='banc-video-hockey')loaded=o}}catch(e){}
  if(loaded){P=Object.assign(newProject(),loaded);if(!P.videos.find(v=>v.id===P.current))P.current=P.videos[0]?P.videos[0].id:null}else buildDemo();
  if(P.rink.half==null)P.rink.half=true;
  setTool('skate');afterLoad();
  const s=cur();if(s){s.t=P.current==='demo'&&!loaded?3.2:s.t;S.lastT=s.t;S.selMarker=(markerAt(s.t)||{}).id||null;renderSeq()}
  trInit();
  requestAnimationFrame(frame);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>drawRinkPanel());
})();
</script>
<script>
if('serviceWorker' in navigator&&location.protocol!=='file:'){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
